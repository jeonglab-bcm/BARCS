name: reanalysis-site

on:
  push:
    branches: [main]
    paths:
      - 'reanalyses/**'
      - 'tools/screen-reanalysis/build_site.R'
      - '.github/workflows/reanalysis-site.yaml'
  pull_request:
    paths:
      - 'reanalyses/**'
      - 'tools/screen-reanalysis/build_site.R'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reanalysis-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("jsonlite", "commonmark"))'
      - name: Build site
        run: Rscript tools/screen-reanalysis/build_site.R --src reanalyses --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
