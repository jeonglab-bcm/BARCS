name: reproduce-reanalyses

# Rebuild recorded reanalyses from GEO and check them against reanalyses/.
# Pull requests and the weekly run check three small records (one with a
# prepare.R); run it by hand with series "all" to check every record.

on:
  pull_request:
    paths:
      - 'reanalyses/**'
      - 'tools/screen-reanalysis/**'
      - 'R/**'
      - 'src/**'
      - '.github/workflows/reproduce-reanalyses.yaml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      series:
        description: 'GSE accessions separated by spaces, or "all"'
        required: true
        default: 'GSE273069 GSE243761 GSE203240'

permissions:
  contents: read

concurrency:
  group: reproduce-reanalyses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SERIES: ${{ github.event.inputs.series || 'GSE273069 GSE243761 GSE203240' }}
      BARCS_NCORES: 4
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install BARCS and script dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp", "RcppArmadillo", "jsonlite", "readxl"))'
          R CMD INSTALL .
      - name: Reproduce
        run: |
          if [ "$SERIES" = "all" ]; then set -- --all; else set -- $SERIES; fi
          Rscript tools/screen-reanalysis/reproduce.R "$@"
